# Weekly sync with the original project (theqkash/esp32flight).
# When upstream has new commits, merge them with this fork's fixes and
# build the firmware. If both succeed, main is updated automatically and
# a release with the ready-to-flash OTA file is published. A merge
# conflict or a failed build leaves main untouched and opens an issue.
name: Upstream sync

on:
  schedule:
    - cron: "0 7 * * 1"   # Mondays 07:00 UTC
  workflow_dispatch:
    inputs:
      test_build:
        description: "Build the current main even with nothing new (no publish)"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com/theqkash/esp32flight.git
          git fetch upstream main --tags
          echo "NEW=$(git rev-list --count HEAD..upstream/main)" >> "$GITHUB_ENV"
          echo "UPSTREAM_SHA=$(git rev-parse --short upstream/main)" >> "$GITHUB_ENV"

      - name: Merge
        if: env.NEW != '0'
        id: merge
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git merge --no-edit upstream/main; then
            echo "result=merged" >> "$GITHUB_OUTPUT"
          else
            git merge --abort
            echo "result=conflict" >> "$GITHUB_OUTPUT"
          fi

      - name: Build firmware
        if: steps.merge.outputs.result == 'merged' || inputs.test_build
        id: build
        continue-on-error: true
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5.1
          target: esp32s3
          path: .

      - name: Publish to main and release the OTA file
        if: steps.merge.outputs.result == 'merged' && steps.build.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git push origin HEAD:main
          ver=$(grep -oE 'PROJECT_VER "[^"]+"' CMakeLists.txt | head -n1 | cut -d'"' -f2 || true)
          tag="fork-$(date -u +%Y%m%d)-$(git rev-parse --short HEAD)"
          cp build/esp32flight.bin "esp32flight-${ver:-fork}-ota.bin"
          log=$(git log --oneline HEAD^1..upstream/main | head -40)
          notes=$(printf 'Upstream %s merged with this fork'"'"'s fixes and built automatically.\n\nFlash: unlock OTA on the device (gear > System), then upload the .bin in the web panel Settings tab.\n\n```\n%s\n```' "$UPSTREAM_SHA" "$log")
          gh release create "$tag" "esp32flight-${ver:-fork}-ota.bin" \
            --title "esp32flight ${ver:-fork} + fixes ($UPSTREAM_SHA)" --notes "$notes"
          echo "RELEASE_TAG=$tag" >> "$GITHUB_ENV"

      - name: Tell the owner an update is ready
        if: success() && env.RELEASE_TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --title "New update ready for your screen ($RELEASE_TAG)" --body "$(printf 'A new version of your flight display software is ready: %s\n\nWhat to do:\n1. On the screen, tap the gear icon, open the System tab and turn on **Allow OTA updates**.\n2. Tell Claude: \"a new esp32flight update is ready, the screen is unlocked\".\n\nThere is no rush. Close this issue once it is installed.\n\n@jrhepworth' "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/$RELEASE_TAG")"

      - name: Report a problem
        if: steps.merge.outputs.result == 'conflict' || (steps.merge.outputs.result == 'merged' && steps.build.outcome != 'success')
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ steps.merge.outputs.result == 'conflict' && 'do not merge cleanly with' || 'merge but fail to build with' }}
        run: |
          title="Upstream $UPSTREAM_SHA needs a hand-merge"
          if ! gh issue list --state open --search "$title in:title" --json number -q '.[0].number' | grep -q .; then
            gh issue create --title "$title" \
              --body "The original project has $NEW new commit(s) that $RESULT this fork's fixes. main was left unchanged and the screen is unaffected. Forward this to Claude to sort out. (cc @jrhepworth)"
          fi

      - name: Test build result
        if: inputs.test_build
        run: |
          test "${{ steps.build.outcome }}" = success
          ls -l build/esp32flight.bin
