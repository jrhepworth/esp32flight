# Weekly check against the original project (theqkash/esp32flight).
# When upstream has new commits, merge them onto this fork's main in a
# branch and open a pull request for review. If the merge conflicts with
# local changes, open an issue instead so it can be resolved by hand.
name: Upstream sync

on:
  schedule:
    - cron: "0 7 * * 1"   # Mondays 07:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com/theqkash/esp32flight.git
          git fetch upstream main --tags
          echo "NEW=$(git rev-list --count HEAD..upstream/main)" >> "$GITHUB_ENV"
          echo "UPSTREAM_SHA=$(git rev-parse --short upstream/main)" >> "$GITHUB_ENV"

      - name: Merge into a sync branch
        if: env.NEW != '0'
        id: merge
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          branch="upstream-sync"
          git checkout -B "$branch"
          if git merge --no-edit upstream/main; then
            git push -f origin "$branch"
            echo "result=merged" >> "$GITHUB_OUTPUT"
          else
            git merge --abort
            echo "result=conflict" >> "$GITHUB_OUTPUT"
          fi

      - name: Open or update the pull request
        if: steps.merge.outputs.result == 'merged'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          log=$(git log --oneline HEAD^1..upstream/main | head -40)
          body=$(printf 'The original project has %s new commit(s) (up to %s). They merge cleanly with this fork'"'"'s fixes.\n\n```\n%s\n```\n\nMerge this, then build and flash as usual.' "$NEW" "$UPSTREAM_SHA" "$log")
          if gh pr view upstream-sync --json state -q .state 2>/dev/null | grep -q OPEN; then
            gh pr edit upstream-sync --body "$body"
          else
            gh pr create --head upstream-sync --base main \
              --title "Bring in upstream changes ($UPSTREAM_SHA)" --body "$body"
          fi

      - name: Report a conflict
        if: steps.merge.outputs.result == 'conflict'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Upstream changes conflict with local fixes ($UPSTREAM_SHA)"
          if ! gh issue list --state open --search "$title in:title" --json number -q '.[0].number' | grep -q .; then
            gh issue create --title "$title" \
              --body "The original project has $NEW new commit(s) that do not merge cleanly with this fork's changes. They need to be merged by hand."
          fi
